# dailylog.vivolightsales.com —— 新日志平台反向代理
# 放到 /etc/nginx/sites-available/dailylog.conf 并软链到 sites-enabled，然后 nginx -t && systemctl reload nginx
# 首次部署先用本文件（80 端口）；签发证书后 certbot 会自动补 443 段（见部署指南第 6 步）

server {
    listen 80;
    server_name dailylog.vivolightsales.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
